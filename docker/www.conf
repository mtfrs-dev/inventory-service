[www]
user = www-data
group = www-data

listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

; The app's .env is read directly from the bind-mounted repo, not injected as
; OS env vars, but keep this off in case that ever changes.
clear_env = no
