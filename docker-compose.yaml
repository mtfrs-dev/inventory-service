services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  worker-default:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    command: php artisan queue:work

  worker-generate-items:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    command: php artisan queue:work --queue=generate-items
