services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  worker-default:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    command: php artisan queue:work

  worker-generate-items:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    command: php artisan queue:work --queue=generate-items